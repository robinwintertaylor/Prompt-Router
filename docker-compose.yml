services:
  prompt-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prompt-router
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./prompt_router.db:/app/prompt_router.db
      - ./.env:/app/.env
