<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="460" height="70" fill="none">
  <!-- Junction Flash Icon -->
  <g transform="translate(10, 5)">
    <!-- Vertical Gateway Pillar -->
    <rect x="22" y="4" width="7" height="52" rx="3.5" fill="#0B4E5D" />
    <!-- Jev 120ms Speed Flash in #C6FF00 -->
    <polygon points="32,7 12,32 25,32 17,54 39,26 26,26" fill="#C6FF00" stroke="#041F25" stroke-width="1.5" stroke-linejoin="round" />
