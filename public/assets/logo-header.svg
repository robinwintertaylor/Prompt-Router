  <!-- Subtitle -->
  <text x="68" y="55" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#80DEEA">GATEWAY INTERFACE ACTIVE (PORT 4000)</text>
